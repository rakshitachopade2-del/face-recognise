[project]
name = "face-poc"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "numpy>=2,<3", "opencv-python-headless>=4.11,<5", "onnxruntime>=1.20,<2",
  "pillow>=11,<13", "pillow-heif>=0.22,<2", "pydantic>=2.10,<3"
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
